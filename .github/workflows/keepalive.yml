name: Keep Render App Awake

on:
  schedule:
    # Every 10 minutes. Render's free tier sleeps after ~15 min idle,
    # so this stays comfortably under that window.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}   # lets you also trigger it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app + database health
        run: |
          curl -s -w "\nStatus: %{http_code}\n" https://aqua-flow-project.onrender.com/healthz
