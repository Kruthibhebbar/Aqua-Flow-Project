# fly.toml — generated for the ride/delivery booking Flask app
# Docs: https://fly.io/docs/reference/configuration/

app = "CHANGE-ME-your-app-name"     # must be globally unique on Fly
primary_region = "bom"              # Mumbai — closest to Bengaluru; change if your users are elsewhere

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false        # keep the VM always on — this is what fixes the Render lag
  auto_start_machines = true
  min_machines_running = 1          # never scale to zero

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# Persistent volume for uploaded files (driver docs, payment proof images)
# so they survive deploys/restarts, unlike Render's ephemeral disk.
# Create it once with: fly volumes create uploads_data --size 1 --region bom
[[mounts]]
  source = "uploads_data"
  destination = "/app/static/uploads"
