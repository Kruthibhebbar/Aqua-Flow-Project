<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AquaFlow - Secure Login & Registration</title>
    <script>
    if (window.history.replaceState) {
        window.history.replaceState(null, null, window.location.href);
    }
</script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #0c4a6e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100px;
            background: repeating-linear-gradient(transparent 0px, transparent 98px, rgba(255,255,255,0.1) 98px, rgba(255,255,255,0.15) 100px);
            pointer-events: none;
            z-index: 1;
            animation: waveMove 8s linear infinite;
        }

        @keyframes waveMove {
            0% { background-position: 0 0; }
            100% { background-position: 200px 0; }
        }

        body::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle at 20% 40%, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 1;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 45px 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.2) inset;
            animation: slideUp 0.6s ease-out;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            z-index: 2;
            position: relative;
        }

        .login-box:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.4);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .brand-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-icon {
            font-size: 48px;
            background: linear-gradient(135deg, #0ea5e9, #06b6d4);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 10px;
        }

        .login-box h2 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            font-size: 14px;
            color: #64748b;
            margin-bottom: 25px;
        }

        .form-label {
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 8px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-label i {
            color: #0ea5e9;
            font-size: 14px;
        }

        .form-control {
            height: 48px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 0 16px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: white;
        }

        .form-control:focus {
            border-color: #0ea5e9;
            box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.15);
            outline: none;
        }

        .password-wrapper {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #94a3b8;
            transition: color 0.3s ease;
            z-index: 10;
        }

        .toggle-password:hover {
            color: #0ea5e9;
        }

        .btn-login, .btn-register, .btn-verify {
            background: linear-gradient(135deg, #0ea5e9, #06b6d4);
            border: none;
            height: 50px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3);
            margin-top: 10px;
            width: 100%;
            color: white;
        }

        .btn-login:hover, .btn-register:hover, .btn-verify:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(14, 165, 233, 0.4);
            background: linear-gradient(135deg, #0284c7, #0891b2);
        }

        .btn-login:active, .btn-register:active, .btn-verify:active {
            transform: translateY(0);
        }

        .btn-login:disabled, .btn-register:disabled, .btn-verify:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .additional-links {
            margin-top: 25px;
            text-align: center;
            font-size: 14px;
        }

        .additional-links a {
            color: #0ea5e9;
            text-decoration: none;
            transition: color 0.3s ease;
            margin: 0 12px;
            cursor: pointer;
        }

        .additional-links a:hover {
            color: #0284c7;
            text-decoration: underline;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: #94a3b8;
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e2e8f0;
        }

        .divider::before {
            margin-right: 12px;
        }

        .divider::after {
            margin-left: 12px;
        }

        .error-message {
            background: #fef2f2;
            border-left: 4px solid #ef4444;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #b91c1c;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .error-message i {
            font-size: 14px;
        }

        .alert-custom {
            background: #f0f9ff;
            border-left: 4px solid #0ea5e9;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #0369a1;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .alert-success {
            background: #f0fdf4;
            border-left-color: #10b981;
            color: #065f46;
        }

        .alert-danger {
            background: linear-gradient(135deg, #fef2f2, #fee2e2);
            border-left: 4px solid #ef4444;
            border-radius: 12px;
            padding: 14px 18px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #b91c1c;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
        }

        .alert-danger i {
            font-size: 18px;
            color: #ef4444;
        }

        .alert-danger .close-btn {
            margin-left: auto;
            cursor: pointer;
            color: #b91c1c;
            opacity: 0.7;
            transition: opacity 0.2s;
            font-size: 18px;
        }

        .alert-danger .close-btn:hover {
            opacity: 1;
        }

        .hidden {
            display: none;
        }

        .otp-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }

        .otp-input-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .otp-input-group .form-control {
            flex: 1;
        }

        .otp-input-group .btn-verify {
            flex: 0 0 auto;
            width: auto;
            padding: 0 20px;
            margin-top: 0;
        }

        .resend-otp {
            font-size: 12px;
            text-align: center;
            margin-top: 10px;
        }

        .resend-otp a {
            color: #0ea5e9;
            cursor: pointer;
            text-decoration: none;
        }

        .resend-otp a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .login-box {
                padding: 30px 25px;
                margin: 20px;
            }
            
            .login-box h2 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

    <div class="login-box">
        <div class="brand-header">
            <div class="brand-icon">
                <i class="fas fa-tint"></i>
            </div>
            <h2>AquaFlow</h2>
            <div class="subtitle" id="pageSubtitle">Access your water management dashboard</div>
        </div>

        <div id="messageContainer"></div>

        <div id="loginFormContainer">
            <!-- ===== ERROR DISPLAY SECTION - Added just above the form ===== -->
            {% if error %}
            <div class="alert-danger" id="errorAlert">
                <i class="fas fa-exclamation-triangle"></i>
                <span style="flex: 1;">{{ error }}</span>
                <span class="close-btn" onclick="this.parentElement.remove()">&times;</span>
            </div>
            {% endif %}

            <form id="loginForm" action="/login" method="POST">
                <div class="mb-3">
                    <label class="form-label">
                        <i class="fas fa-envelope"></i> Email Address
                    </label>
                    <input type="email" 
                           id="emailInput"
                           name="email"
                           class="form-control" 
                           placeholder="admin@aquaflow.com"
                           autocomplete="email"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <div class="password-wrapper">
                        <input type="password" 
                               id="passwordInput"
                               name="password"
                               class="form-control" 
                               placeholder="Enter your password"
                               autocomplete="current-password"
                               required>
                        <span class="toggle-password" onclick="togglePassword('passwordInput')">
                            <i class="fas fa-eye"></i>
                        </span>
                    </div>
                </div>

                <button type="submit" class="btn-login">
                    <i class="fas fa-sign-in-alt me-2"></i>Login to AquaFlow
                </button>

                <div class="divider">
                    <span>Secure Access</span>
                </div>

                <div class="additional-links">
                    <a onclick="showRegisterForm()"><i class="fas fa-user-plus"></i> Create Account</a>
                    <a href="/forgot-password"><i class="fas fa-key"></i> Forgot Password?</a>
                </div>
            </form>
        </div>

        <div id="registerFormContainer" class="hidden">
            <form id="registerForm" action="/signup" method="POST">
                <div class="mb-3">
                    <label class="form-label">
                        <i class="fas fa-user"></i> Full Name
                    </label>
                    <input type="text" 
                           id="regName"
                           name="name"
                           class="form-control" 
                           placeholder="John Doe"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        <i class="fas fa-envelope"></i> Email Address
                    </label>
                    <input type="email" 
                           id="regEmail"
                           name="email"
                           class="form-control" 
                           placeholder="your@email.com"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <div class="password-wrapper">
                        <input type="password" 
                               id="regPassword"
                               name="password"
                               class="form-control" 
                               placeholder="Create a password (min 6 characters)"
                               required>
                        <span class="toggle-password" onclick="togglePassword('regPassword')">
                            <i class="fas fa-eye"></i>
                        </span>
                    </div>
                </div>

                <button type="submit" class="btn-register">
                    <i class="fas fa-paper-plane me-2"></i>Send Verification OTP
                </button>

                <div class="divider">
                    <span>Already have an account?</span>
                </div>

                <div class="additional-links">
                    <a onclick="showLoginForm()"><i class="fas fa-sign-in-alt"></i> Back to Login</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        function togglePassword(fieldId) {
            const passwordInput = document.getElementById(fieldId);
            const toggleIcon = passwordInput.parentElement.querySelector('.toggle-password i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }

        let persistentError = null;

        function showMessage(message, type = 'info', isPersistent = false) {
            const container = document.getElementById('messageContainer');
            
            if (!isPersistent) {
                const existingNonPersistent = container.querySelectorAll('.non-persistent-msg');
                existingNonPersistent.forEach(el => el.remove());
            }
            
            const msgDiv = document.createElement('div');
            if (type === 'error') {
                msgDiv.className = 'error-message';
                if (!isPersistent) msgDiv.classList.add('non-persistent-msg');
                msgDiv.innerHTML = `<i class="fas fa-exclamation-triangle"></i> ${message}`;
            } else {
                msgDiv.className = 'alert-custom';
                if (type === 'success') msgDiv.classList.add('alert-success');
                if (!isPersistent) msgDiv.classList.add('non-persistent-msg');
                msgDiv.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-info-circle'}"></i> ${message}`;
            }
            
            container.appendChild(msgDiv);
            
            if (!isPersistent) {
                setTimeout(() => {
                    if (msgDiv.parentNode) msgDiv.remove();
                }, 5000);
            }
        }

        function showPersistentError(message) {
            const container = document.getElementById('messageContainer');
            const existingError = container.querySelector('.persistent-error');
            if (existingError) {
                existingError.remove();
            }
            
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message persistent-error';
            errorDiv.innerHTML = `<i class="fas fa-exclamation-triangle"></i> ${message}`;
            container.insertBefore(errorDiv, container.firstChild);
            persistentError = message;
        }

        function removePersistentError() {
            const container = document.getElementById('messageContainer');
            const existingError = container.querySelector('.persistent-error');
            if (existingError) {
                existingError.remove();
                persistentError = null;
            }
        }

        function showLoginForm() {
            document.getElementById('loginFormContainer').classList.remove('hidden');
            document.getElementById('registerFormContainer').classList.add('hidden');
            document.getElementById('pageSubtitle').textContent = 'Access your water management dashboard';
            const container = document.getElementById('messageContainer');
            container.innerHTML = '';
            persistentError = null;
        }

        function showRegisterForm() {
            document.getElementById('loginFormContainer').classList.add('hidden');
            document.getElementById('registerFormContainer').classList.remove('hidden');
            document.getElementById('pageSubtitle').textContent = 'Create your AquaFlow account';
            const container = document.getElementById('messageContainer');
            container.innerHTML = '';
            persistentError = null;
        }

        const emailInput = document.getElementById('emailInput');
        if (emailInput) {
            emailInput.addEventListener('input', function() {
                if (persistentError !== null) {
                    removePersistentError();
                }
                const errorAlert = document.getElementById('errorAlert');
                if (errorAlert) {
                    errorAlert.remove();
                }
            });
        }
        
        const passwordField = document.getElementById('passwordInput');
        if (passwordField) {
            passwordField.addEventListener('input', function() {
                const errorAlert = document.getElementById('errorAlert');
                if (errorAlert) {
                    errorAlert.remove();
                }
            });
        }
        
        const inputs = document.querySelectorAll('.form-control');
        inputs.forEach(input => {
            input.addEventListener('focus', function() {
                const label = this.closest('.mb-3')?.querySelector('.form-label');
                if (label) label.style.color = '#0ea5e9';
            });
            input.addEventListener('blur', function() {
                const label = this.closest('.mb-3')?.querySelector('.form-label');
                if (label) label.style.color = '#1e293b';
            });
        });
        
        window.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const error = urlParams.get('error');
            const success = urlParams.get('success');
            
            if (error === 'session_expired') {
                showMessage('⏰ Session expired. Please login again.', 'info');
            } else if (success === 'logout') {
                showMessage('👋 You have been logged out successfully.', 'success');
            }
            
            const loginForm = document.getElementById('loginForm');
            if (loginForm) {
                loginForm.addEventListener('submit', function(e) {
                    const email = document.getElementById('emailInput').value.trim();
                    const password = document.getElementById('passwordInput').value;
                    
                    if (!email) {
                        e.preventDefault();
                        showMessage('Please enter your email address.', 'error');
                        return false;
                    }
                    
                    if (!password) {
                        e.preventDefault();
                        showMessage('Please enter your password.', 'error');
                        return false;
                    }
                    
                    const btn = document.querySelector('.btn-login');
                    btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Authenticating...';
                    btn.disabled = true;
                    
                    setTimeout(() => {
                        if (btn.disabled) {
                            btn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Login to AquaFlow';
                            btn.disabled = false;
                        }
                    }, 10000);
                });
            }
            
            const registerForm = document.getElementById('registerForm');
            if (registerForm) {
                registerForm.addEventListener('submit', function(e) {
                    const name = document.getElementById('regName').value.trim();
                    const email = document.getElementById('regEmail').value.trim();
                    const password = document.getElementById('regPassword').value;
                    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                    
                    if (!name) {
                        e.preventDefault();
                        showMessage('Please enter your full name.', 'error');
                        return false;
                    }
                    
                    if (!email || !emailRegex.test(email)) {
                        e.preventDefault();
                        showMessage('Please enter a valid email address.', 'error');
                        return false;
                    }
                    
                    if (!password || password.length < 6) {
                        e.preventDefault();
                        showMessage('Password must be at least 6 characters.', 'error');
                        return false;
                    }
                    
                    const btn = document.querySelector('.btn-register');
                    btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Sending OTP...';
                    btn.disabled = true;
                    
                    setTimeout(() => {
                        if (btn.disabled) {
                            btn.innerHTML = '<i class="fas fa-paper-plane me-2"></i>Send Verification OTP';
                            btn.disabled = false;
                        }
                    }, 10000);
                });
            }
        });
    </script>
    <script>
history.pushState(null, null, location.href);

window.addEventListener('popstate', function () {
    history.pushState(null, null, location.href);
    window.location.replace("/");
});
</script>
</body>
</html>
