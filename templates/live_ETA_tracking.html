<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AquaFlow | Live Fleet Command Center</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; }
    body { background: radial-gradient(circle at 20% 20%, #0d1526, #03060c); color:#eef5ff; min-height:100vh; padding:24px; }
    .top-bar { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:20px; }
    h1 { font-size:1.9rem; font-weight:800; display:flex; align-items:center; gap:10px; }
    h1 i { color:#2d7aff; }
    .back-link { color:#9fb4d6; text-decoration:none; font-weight:600; font-size:13px; }
    .back-link:hover { color:#fff; }
    .stat-row { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
    .stat-chip { background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); border-radius:14px; padding:10px 16px; font-size:13px; font-weight:600; display:flex; align-items:center; gap:8px; }
    .live-dot { width:8px; height:8px; border-radius:50%; background:#22c55e; box-shadow:0 0 8px #22c55e; animation:pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.35;} }
    .grid { display:grid; grid-template-columns: 1.3fr 1fr; gap:18px; }
    @media (max-width: 980px) { .grid { grid-template-columns: 1fr; } }
    #fleetMap { height:520px; border-radius:20px; overflow:hidden; border:1px solid rgba(255,255,255,0.1); }
    .panel { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:20px; padding:16px; max-height:520px; overflow-y:auto; }
    .panel h3 { font-size:14px; text-transform:uppercase; letter-spacing:.5px; color:#9fb4d6; margin-bottom:12px; }
    .delivery-card { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:14px; padding:12px 14px; margin-bottom:10px; }
    .delivery-card .row1 { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
    .delivery-card .cust { font-weight:700; font-size:14px; }
    .status-pill { font-size:10.5px; font-weight:700; padding:3px 10px; border-radius:20px; }
    .st-online { background:#16a34a33; color:#4ade80; }
    .st-offline { background:#dc262633; color:#f87171; }
    .st-stopped { background:#d9770633; color:#fbbf24; }
    .meta-row { font-size:12px; color:#b8c7e0; display:flex; justify-content:space-between; margin-top:4px; }
    .empty { text-align:center; color:#7c8aa5; padding:40px 10px; }
    .deviation-tag { color:#f87171; font-size:11.5px; font-weight:700; margin-top:6px; }
    .refresh-note { text-align:center; color:#7c8aa5; font-size:12px; margin-top:16px; }
</style>
</head>
<body>

<div class="top-bar">
    <h1><i class="fa-solid fa-satellite-dish"></i> Live Fleet Command Center</h1>
    <a href="/admin-dashboard" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Admin Dashboard</a>
</div>

<div class="stat-row">
    <div class="stat-chip"><span class="live-dot"></span> Live</div>
    <div class="stat-chip"><i class="fa-solid fa-truck-fast"></i> Active Deliveries: <span id="statActive">0</span></div>
    <div class="stat-chip"><i class="fa-solid fa-tower-broadcast"></i> Drivers Online: <span id="statOnline">0</span> / <span id="statTotal">0</span></div>
    <div class="stat-chip"><i class="fa-regular fa-clock"></i> Updated: <span id="statUpdated">--</span></div>
</div>

<div class="grid">
    <div id="fleetMap"></div>
    <div class="panel">
        <h3>Active Deliveries — real GPS, real routing</h3>
        <div id="deliveryList"><div class="empty">Loading live fleet data…</div></div>
    </div>
</div>

<p class="refresh-note"><i class="fa-solid fa-rotate"></i> Auto-refreshes from live driver GPS every 5 seconds — no simulated data</p>

<script>
const map = L.map('fleetMap').setView([20.5937, 78.9629], 5);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OSM</a> contributors'
}).addTo(map);

let driverMarkers = {};   // booking_id -> marker
let customerMarkers = {}; // booking_id -> marker
let routeLines = {};      // booking_id -> polyline
let firstFit = true;

function statusColor(status) {
    if (status === 'Arrived') return '#22c55e';
    if (status === 'On The Way') return '#f59e0b';
    if (status === 'Accepted') return '#3b82f6';
    return '#8ca0a9';
}

function truckIcon(color) {
    return L.divIcon({
        className: '',
        html: `<div style="background:${color}; width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 4px ${color}33;"><i class="fa-solid fa-truck" style="color:#03060c; font-size:12px;"></i></div>`,
        iconSize: [26, 26],
        iconAnchor: [13, 13]
    });
}

function renderDeliveryCard(d) {
    let statusClass = 'st-online', statusLabel = d.status;
    if (d.driver_online === false) { statusClass = 'st-offline'; statusLabel = 'Driver Offline'; }
    else if (d.moving_status === 'Stopped') { statusClass = 'st-stopped'; statusLabel = 'Stopped'; }

    const distanceLine = d.distance_remaining_km != null
        ? `${d.distance_remaining_km} km remaining · ETA ~${d.eta_min} min`
        : (d.driver_online === false ? 'No recent GPS signal' : 'Waiting for driver GPS…');

    return `
        <div class="delivery-card">
            <div class="row1">
                <span class="cust">${escapeHtml(d.customer || 'Customer')}</span>
                <span class="status-pill ${statusClass}">${escapeHtml(statusLabel)}</span>
            </div>
            <div class="meta-row"><span><i class="fa-solid fa-user"></i> ${escapeHtml(d.driver_name || 'Not assigned')}</span><span>${escapeHtml(d.truck_number || '')}</span></div>
            <div class="meta-row"><span><i class="fa-solid fa-route"></i> ${distanceLine}</span></div>
            ${d.route_deviated ? '<div class="deviation-tag"><i class="fa-solid fa-triangle-exclamation"></i> Driver deviated from planned route</div>' : ''}
        </div>
    `;
}

function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
}

async function refreshFleet() {
    try {
        const res = await fetch('/api/gps/admin-fleet?t=' + Date.now());
        const data = await res.json();
        if (!data.success) return;

        document.getElementById('statActive').textContent = data.deliveries.length;
        document.getElementById('statOnline').textContent = data.online_drivers;
        document.getElementById('statTotal').textContent = data.total_drivers;
        document.getElementById('statUpdated').textContent = new Date(data.timestamp).toLocaleTimeString();

        const listEl = document.getElementById('deliveryList');
        if (data.deliveries.length === 0) {
            listEl.innerHTML = '<div class="empty">No active deliveries right now.</div>';
        } else {
            listEl.innerHTML = data.deliveries.map(renderDeliveryCard).join('');
        }

        const seenIds = new Set();
        const boundsPoints = [];

        data.deliveries.forEach(d => {
            seenIds.add(d.booking_id);
            const color = statusColor(d.status);

            if (d.customer_lat != null && d.customer_lng != null) {
                if (!customerMarkers[d.booking_id]) {
                    customerMarkers[d.booking_id] = L.circleMarker([d.customer_lat, d.customer_lng], {
                        radius: 6, color: '#fff', fillColor: '#ef4444', fillOpacity: 1, weight: 2
                    }).addTo(map).bindPopup(`<strong>📍 ${escapeHtml(d.customer || 'Customer')}</strong>`);
                } else {
                    customerMarkers[d.booking_id].setLatLng([d.customer_lat, d.customer_lng]);
                }
                boundsPoints.push([d.customer_lat, d.customer_lng]);
            }

            if (d.driver_lat != null && d.driver_lng != null) {
                if (!driverMarkers[d.booking_id]) {
                    driverMarkers[d.booking_id] = L.marker([d.driver_lat, d.driver_lng], { icon: truckIcon(color) }).addTo(map);
                } else {
                    driverMarkers[d.booking_id].setLatLng([d.driver_lat, d.driver_lng]);
                    driverMarkers[d.booking_id].setIcon(truckIcon(color));
                }
                driverMarkers[d.booking_id].bindPopup(
                    `<strong>🚛 ${escapeHtml(d.driver_name || 'Driver')}</strong><br>${escapeHtml(d.customer || '')}` +
                    (d.eta_min != null ? `<br>ETA: ${d.eta_min} min (${d.distance_remaining_km} km)` : '')
                );
                boundsPoints.push([d.driver_lat, d.driver_lng]);

                if (d.customer_lat != null) {
                    if (routeLines[d.booking_id]) map.removeLayer(routeLines[d.booking_id]);
                    routeLines[d.booking_id] = L.polyline(
                        [[d.driver_lat, d.driver_lng], [d.customer_lat, d.customer_lng]],
                        { color, weight: 3, dashArray: '6,6', opacity: 0.7 }
                    ).addTo(map);
                }
            }
        });

        // Remove markers for deliveries no longer active (delivered/cancelled)
        Object.keys(driverMarkers).forEach(id => {
            if (!seenIds.has(id)) { map.removeLayer(driverMarkers[id]); delete driverMarkers[id]; }
        });
        Object.keys(customerMarkers).forEach(id => {
            if (!seenIds.has(id)) { map.removeLayer(customerMarkers[id]); delete customerMarkers[id]; }
        });
        Object.keys(routeLines).forEach(id => {
            if (!seenIds.has(id)) { map.removeLayer(routeLines[id]); delete routeLines[id]; }
        });

        if (firstFit && boundsPoints.length > 0) {
            map.fitBounds(boundsPoints, { padding: [60, 60] });
            firstFit = false;
        }
    } catch (e) {
        console.log('Fleet refresh failed', e);
    }
}

refreshFleet();
setInterval(refreshFleet, 5000);
</script>
</body>
</html>
