<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>NexusPay | Modern Payment Command Center</title>
    <!-- Font Awesome 6 (Free CDN) for crisp icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts: Inter + Space Grotesk for modern look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Chart.js CDN for extraordinary analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 10% 20%, rgba(10, 12, 28, 0.96), rgba(2, 5, 18, 0.98));
            font-family: 'Inter', sans-serif;
            padding: 2rem 1.8rem;
            color: #eef5ff;
        }

        /* modern glassmorphism container */
        .dashboard-wrapper {
            max-width: 1600px;
            margin: 0 auto;
        }

        /* header with animated gradient */
        .header-modern {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 2.5rem;
            background: rgba(18, 25, 55, 0.55);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            padding: 1.2rem 2rem;
            border: 1px solid rgba(72, 187, 255, 0.2);
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-family: 'Space Grotesk', monospace;
            font-size: 1.9rem;
            background: linear-gradient(135deg, #FFF, #6ee7ff, #3b82f6);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        h1 i {
            background: none;
            color: #3b82f6;
            font-size: 2rem;
            background-clip: unset;
            -webkit-background-clip: unset;
            -webkit-text-fill-color: initial;
        }

        .stats-chip {
            display: flex;
            gap: 18px;
        }

        .stat-badge {
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(8px);
            padding: 0.6rem 1.3rem;
            border-radius: 60px;
            font-weight: 500;
            font-size: 0.9rem;
            border-left: 3px solid #3b82f6;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .stat-badge i {
            margin-right: 8px;
            color: #60a5fa;
        }

        /* analytics grid */
        .analytics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.6rem;
            margin-bottom: 2.2rem;
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            padding: 1.2rem 1.4rem;
            border: 1px solid rgba(59,130,246,0.25);
            transition: all 0.25s ease;
            box-shadow: 0 8px 20px -8px rgba(0,0,0,0.4);
        }

        .glass-card:hover {
            border-color: rgba(59,130,246,0.6);
            transform: translateY(-3px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
            font-weight: 600;
            color: #bbd7fb;
        }

        .revenue-number {
            font-size: 2.1rem;
            font-weight: 700;
            font-family: 'Space Grotesk', monospace;
            color: #f0f9ff;
        }

        /* search + filters */
        .action-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin: 1.5rem 0 1.8rem 0;
            gap: 16px;
        }

        .search-container {
            background: rgba(0, 0, 0, 0.45);
            border-radius: 60px;
            padding: 0.3rem 0.3rem 0.3rem 1.2rem;
            display: flex;
            align-items: center;
            backdrop-filter: blur(4px);
            border: 1px solid #2d3a5e;
        }

        .search-container input {
            background: transparent;
            border: none;
            padding: 0.6rem;
            color: white;
            font-size: 0.9rem;
            width: 220px;
            outline: none;
        }

        .search-container button {
            background: #2563eb;
            border: none;
            padding: 0.5rem 1.1rem;
            border-radius: 50px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .filter-group select {
            background: #0f172a;
            border: 1px solid #334155;
            padding: 0.5rem 1rem;
            border-radius: 40px;
            color: white;
            font-weight: 500;
            cursor: pointer;
            outline: none;
        }

        .filter-group input[type="date"] {
            background: #0f172a;
            border: 1px solid #334155;
            padding: 0.5rem 1rem;
            border-radius: 40px;
            color: #cbd5e1;
            font-weight: 500;
            outline: none;
            color-scheme: dark;
        }

        a.btn-primary {
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: linear-gradient(95deg, #2563eb, #1e40af);
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        /* payment cards grid — modern */
        .payments-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 1.8rem;
            margin-top: 1rem;
        }

        .payment-card-modern {
            background: linear-gradient(145deg, #10182f, #0b1120);
            border-radius: 2rem;
            padding: 1.4rem 1.6rem;
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            border: 1px solid rgba(66, 153, 225, 0.2);
            box-shadow: 0 15px 35px -12px black;
            position: relative;
            overflow: hidden;
        }

        .payment-card-modern:hover {
            border-color: #3b82f6;
            transform: scale(1.01);
            background: linear-gradient(145deg, #131e3b, #0a0f22);
        }

        .badge-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            backdrop-filter: blur(4px);
        }

        .status-paid {
            background: #10b98120;
            border-left: 3px solid #10b981;
            color: #86efac;
        }

        .status-pending {
            background: #f9731620;
            border-left: 3px solid #f97316;
            color: #fdba74;
        }

        .payment-details p {
            margin: 0.7rem 0;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.9rem;
            color: #cdddf7;
        }

        .payment-details i {
            width: 24px;
            color: #60a5fa;
        }

        .transaction-id {
            font-family: monospace;
            background: #00000030;
            padding: 0.2rem 0.5rem;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        .action-buttons {
            margin-top: 1rem;
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .small-btn {
            background: #1e293b;
            border: none;
            padding: 6px 12px;
            border-radius: 30px;
            color: #b9d0f0;
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }

        .small-btn:hover {
            background: #2d3a5e;
            color: white;
        }

        .toast-msg {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #1f2937ee;
            backdrop-filter: blur(16px);
            padding: 0.8rem 1.3rem;
            border-radius: 50px;
            border-left: 5px solid #3b82f6;
            font-weight: 500;
            z-index: 999;
            transition: 0.2s;
            font-size: 0.85rem;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            pointer-events: none;
        }

        .chart-container {
            max-height: 220px;
            margin-top: 0.5rem;
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            font-size: 0.75rem;
            opacity: 0.6;
        }

        @media (max-width: 700px) {
            body { padding: 1rem; }
            .payments-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="dashboard-wrapper">
    <!-- Modern header area -->
    <div class="header-modern">
        <h1><i class="fas fa-bolt"></i> NexusPay <span style="font-size: 1rem; background: none; -webkit-text-fill-color: #94a3b8;">| command center</span></h1>
        <div class="stats-chip">
            <div class="stat-badge"><i class="fas fa-check-circle"></i> <span id="totalPaidCount">0</span> settled</div>
            <div class="stat-badge"><i class="fas fa-clock"></i> <span id="totalPendingCount">0</span> pending</div>
            <div class="stat-badge"><i class="fas fa-rupee-sign"></i> ₹<span id="totalRevenue">0</span> volume</div>
        </div>
    </div>

    <!-- analytics cards -->
    <div class="analytics-grid">
        <div class="glass-card">
            <div class="card-header"><span><i class="fas fa-chart-line"></i> Revenue trend (last 6 txns)</span> <i class="fas fa-arrow-trend-up" style="color:#34d399;"></i></div>
            <canvas id="revenueChart" width="400" height="160" style="max-height: 160px; width:100%"></canvas>
        </div>
        <div class="glass-card">
            <div class="card-header"><span><i class="fas fa-wallet"></i> Method distribution</span> <i class="fas fa-chart-pie"></i></div>
            <canvas id="methodChart" width="400" height="160" style="max-height: 160px; width:100%"></canvas>
        </div>
        <div class="glass-card">
            <div class="card-header"><span><i class="fas fa-percent"></i> Success ratio</span></div>
            <div style="display: flex; align-items: baseline; gap: 8px; margin-top: 10px;"><span class="revenue-number" id="successRate">0</span><span>%</span>
                <div style="height: 8px; flex:1; background:#1e293b; border-radius: 10px;"><div id="rateFill" style="width:0%; height:8px; background:#3b82f6; border-radius:10px;"></div></div>
            </div>
            <div style="margin-top: 14px;"><i class="fas fa-lightbulb"></i> Real-time updates with actions</div>
        </div>
    </div>

    <!-- dynamic control bar : search, filter, export -->
    <div class="action-bar">
        <div class="search-container">
            <i class="fas fa-search" style="color:#94a3b8;"></i>
            <input type="text" id="searchInput" placeholder="TXN ID, Booking ID, email..." autocomplete="off">
            <button id="searchBtn"><i class="fas fa-arrow-right"></i> Filter</button>
        </div>
        <div class="filter-group">
            <select id="statusFilter">
                <option value="all">All statuses</option>
                <option value="Paid">✅ Paid</option>
                <option value="Settled">✅ Settled</option>
                <option value="Pending">⏳ Pending</option>
                <option value="Waiting Admin Approval">⏳ Waiting Admin Approval</option>
                <option value="Failed">❌ Failed</option>
                <option value="Verification Failed">❌ Verification Failed</option>
                <option value="Rejected">❌ Rejected</option>
                <option value="Withdrawn">💸 Withdrawn</option>
            </select>
            <select id="typeFilter">
                <option value="all">All types</option>
                <option value="booking_payment">Booking Payment</option>
                <option value="wallet_topup">Wallet Top-up</option>
                <option value="cod_collection">COD Collection</option>
                <option value="withdrawal">Withdrawal</option>
            </select>
            <select id="gatewayFilter">
                <option value="all">All gateways</option>
                <option value="razorpay">Razorpay</option>
                <option value="cash">Cash</option>
                <option value="wallet">Wallet</option>
                <option value="bank_transfer">Bank Transfer</option>
            </select>
            <input type="date" id="dateFrom" title="From date">
            <input type="date" id="dateTo" title="To date">
        </div>
        <a id="exportBtn" class="btn-primary" href="#"><i class="fas fa-file-export"></i> Export CSV</a>
    </div>

    <!-- dynamic payments grid injected via JS -->
    <div id="paymentsContainer" class="payments-grid"></div>
    <div id="paginationBar" style="display:flex; justify-content:center; gap:10px; margin-top:1.5rem; align-items:center;"></div>
    <footer>
        <i class="fas fa-shield-alt"></i> Live data from the payment ledger • every transaction verified server-side
    </footer>
</div>
<div id="toastRoot" class="toast-msg" style="display: none;"></div>

<script>
    // ------------------- REAL PAYMENT MANAGEMENT (reads payment_transactions via the API) -------------------
    let currentPage = 1;
    let latestStats = null;

    const paymentsContainer = document.getElementById('paymentsContainer');
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const statusFilter = document.getElementById('statusFilter');
    const typeFilter = document.getElementById('typeFilter');
    const gatewayFilter = document.getElementById('gatewayFilter');
    const dateFrom = document.getElementById('dateFrom');
    const dateTo = document.getElementById('dateTo');
    const exportBtn = document.getElementById('exportBtn');
    const paginationBar = document.getElementById('paginationBar');
    const totalPaidSpan = document.getElementById('totalPaidCount');
    const totalPendingSpan = document.getElementById('totalPendingCount');
    const totalRevenueSpan = document.getElementById('totalRevenue');
    const successRateSpan = document.getElementById('successRate');
    const rateFillDiv = document.getElementById('rateFill');

    let revenueChart, methodChart;

    function showToast(message, isError = false) {
        const toast = document.getElementById('toastRoot');
        toast.style.display = 'block';
        toast.textContent = message;
        toast.style.borderLeftColor = isError ? '#f97316' : '#3b82f6';
        toast.style.background = '#111827ee';
        setTimeout(() => { toast.style.display = 'none'; }, 2600);
    }

    function currentParams(page) {
        const params = new URLSearchParams();
        if (searchInput.value.trim()) params.set('q', searchInput.value.trim());
        if (statusFilter.value !== 'all') params.set('status', statusFilter.value);
        if (typeFilter.value !== 'all') params.set('type', typeFilter.value);
        if (gatewayFilter.value !== 'all') params.set('gateway', gatewayFilter.value);
        if (dateFrom.value) params.set('date_from', dateFrom.value);
        if (dateTo.value) params.set('date_to', dateTo.value);
        params.set('page', page || currentPage);
        return params;
    }

    async function loadTransactions(page = 1) {
        currentPage = page;
        try {
            const res = await fetch('/api/admin/payment-transactions?' + currentParams(page).toString());
            const data = await res.json();
            if (!data.success) {
                showToast(data.message || 'Could not load payments', true);
                return;
            }
            latestStats = data.stats;
            renderPaymentCards(data.transactions);
            updateHeaderStats(data.stats);
            updateRevenueChart(data.transactions);
            updateMethodChart(data.stats);
            renderPagination(data.page, data.total_pages);
        } catch (err) {
            showToast('Network error loading payments', true);
        }
    }

    function updateHeaderStats(stats) {
        const paidCount = (stats.by_status['Paid']?.count || 0) + (stats.by_status['Settled']?.count || 0);
        totalPaidSpan.innerText = paidCount;
        totalPendingSpan.innerText = stats.pending_count;
        totalRevenueSpan.innerText = stats.total_revenue.toLocaleString('en-IN');
        successRateSpan.innerText = stats.success_rate;
        rateFillDiv.style.width = `${stats.success_rate}%`;
    }

    function updateRevenueChart(transactions) {
        const paidSorted = [...transactions]
            .filter(t => t.status === 'Paid' || t.status === 'Settled')
            .slice(0, 6)
            .reverse();
        const labels = paidSorted.map(t => t.booking_id ? `#${t.booking_id.slice(-6)}` : t.transaction_id.slice(-6));
        const amounts = paidSorted.map(t => t.amount || 0);
        if (revenueChart) revenueChart.destroy();
        const ctx = document.getElementById('revenueChart').getContext('2d');
        revenueChart = new Chart(ctx, {
            type: 'line',
            data: { labels: labels, datasets: [{ label: '₹ Amount', data: amounts, borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,0.1)', tension: 0.3, fill: true, pointBackgroundColor: '#60a5fa' }] },
            options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { labels: { color: '#cbd5e1' } } }, scales: { y: { grid: { color: '#1e293b' }, ticks: { color: '#cbd5e6' } }, x: { ticks: { color: '#94a3b8' } } } }
        });
    }

    function updateMethodChart(stats) {
        const labels = Object.keys(stats.by_status);
        const counts = labels.map(k => stats.by_status[k].count);
        if (methodChart) methodChart.destroy();
        const ctx = document.getElementById('methodChart').getContext('2d');
        methodChart = new Chart(ctx, {
            type: 'doughnut',
            data: { labels: labels, datasets: [{ data: counts, backgroundColor: ['#3b82f6', '#f97316', '#10b981', '#a855f7', '#ec4899', '#eab308', '#6366f1'], borderWidth: 0 }] },
            options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { color: '#cbd5e6', font: { size: 10 } } } } }
        });
    }

    function renderPaymentCards(items) {
        if (!paymentsContainer) return;
        if (items.length === 0) {
            paymentsContainer.innerHTML = `<div class="glass-card" style="grid-column:1/-1; text-align:center; padding:3rem;"><i class="fas fa-inbox fa-2x"></i><p>No matching payments found</p></div>`;
            return;
        }
        const successStatuses = ['Paid', 'Settled', 'Withdrawn'];
        const failStatuses = ['Failed', 'Verification Failed', 'Rejected', 'Expired'];
        paymentsContainer.innerHTML = items.map(t => {
            const isSuccess = successStatuses.includes(t.status);
            const isFail = failStatuses.includes(t.status);
            const statusClass = isSuccess ? 'status-paid' : (isFail ? 'status-pending' : 'status-pending');
            const statusIcon = isSuccess ? '<i class="fas fa-check-circle"></i>' : (isFail ? '<i class="fas fa-times-circle"></i>' : '<i class="fas fa-hourglass-half"></i>');
            return `
                <div class="payment-card-modern" data-txn="${t.transaction_id}">
                    <div style="display:flex; justify-content: space-between; align-items:center; flex-wrap:wrap; margin-bottom:12px;">
                        <h3 style="font-family:'Space Grotesk'; letter-spacing:-0.3px;"><i class="fas fa-ticket-alt"></i> ${t.booking_id ? '#' + t.booking_id.slice(-8) : t.type}</h3>
                        <span class="badge-status ${statusClass}">${statusIcon} ${t.status}</span>
                    </div>
                    <div class="payment-details">
                        <p><i class="fas fa-user-astronaut"></i> ${t.user_email || t.driver_email || '—'}</p>
                        <p><i class="fas fa-rupee-sign"></i> Amount : ₹${(t.amount || 0).toLocaleString('en-IN')}</p>
                        <p><i class="fas fa-credit-card"></i> ${t.type.replace('_', ' ')} · ${t.gateway || '—'}</p>
                        <p><i class="fas fa-fingerprint"></i> ${t.transaction_id}</p>
                        <p><i class="far fa-calendar-alt"></i> ${t.created_at || '—'}</p>
                    </div>
                </div>
            `;
        }).join('');
    }

    function renderPagination(page, totalPages) {
        if (totalPages <= 1) { paginationBar.innerHTML = ''; return; }
        let html = '';
        if (page > 1) html += `<button class="small-btn" onclick="loadTransactions(${page - 1})"><i class="fas fa-chevron-left"></i> Prev</button>`;
        html += `<span style="color:#94a3b8; font-size:0.85rem;">Page ${page} of ${totalPages}</span>`;
        if (page < totalPages) html += `<button class="small-btn" onclick="loadTransactions(${page + 1})">Next <i class="fas fa-chevron-right"></i></button>`;
        paginationBar.innerHTML = html;
    }

    searchBtn.addEventListener('click', () => loadTransactions(1));
    statusFilter.addEventListener('change', () => loadTransactions(1));
    typeFilter.addEventListener('change', () => loadTransactions(1));
    gatewayFilter.addEventListener('change', () => loadTransactions(1));
    dateFrom.addEventListener('change', () => loadTransactions(1));
    dateTo.addEventListener('change', () => loadTransactions(1));
    searchInput.addEventListener('keyup', (e) => { if (e.key === 'Enter') loadTransactions(1); });
    exportBtn.addEventListener('click', (e) => {
        e.preventDefault();
        window.location.href = '/api/admin/payment-transactions/export?' + currentParams(1).toString();
    });

    loadTransactions(1);
</script>

<!-- ================= SINGLE-PATH BACK NAVIGATION FIX ================= -->
<script>
(function () {
    var HOME_URL = "/dashboard";
    if (window.history && window.history.pushState) {
        history.pushState(null, "", location.href);
        window.addEventListener("popstate", function () {
            history.pushState(null, "", location.href);
            window.location.href = HOME_URL;
        });
    }
})();
</script>

</body>
</html>
