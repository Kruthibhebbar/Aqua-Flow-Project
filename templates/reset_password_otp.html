<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AquaFlow | Reset Password</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#0f172a,#1e3a8a,#06b6d4);
            overflow:hidden;
            padding:20px;
        }

        body::before{
            content:'';
            position:absolute;
            width:600px;
            height:600px;
            background:rgba(255,255,255,0.06);
            border-radius:50%;
            top:-200px;
            right:-150px;
            filter:blur(20px);
        }

        body::after{
            content:'';
            position:absolute;
            width:500px;
            height:500px;
            background:rgba(255,255,255,0.05);
            border-radius:50%;
            bottom:-180px;
            left:-120px;
            filter:blur(20px);
        }

        .container{
            width:100%;
            max-width:470px;
            background:rgba(255,255,255,0.12);
            backdrop-filter:blur(18px);
            border:1px solid rgba(255,255,255,0.15);
            border-radius:32px;
            padding:45px 35px;
            position:relative;
            z-index:2;
            box-shadow:0 20px 50px rgba(0,0,0,0.35);
            animation:fadeIn 0.6s ease;
        }

        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(30px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        .logo{
            text-align:center;
            margin-bottom:15px;
        }

        .logo i{
            font-size:65px;
            color:#38bdf8;
        }

        h1{
            text-align:center;
            color:white;
            margin-bottom:10px;
            font-size:34px;
            font-weight:700;
        }

        .subtitle{
            text-align:center;
            color:#dbeafe;
            margin-bottom:35px;
            font-size:14px;
        }

        .input-box{
            position:relative;
            margin-bottom:22px;
        }

        .input-box i{
            position:absolute;
            left:18px;
            top:50%;
            transform:translateY(-50%);
            color:#94a3b8;
            font-size:18px;
        }

        .input-box input{
            width:100%;
            padding:16px 16px 16px 50px;
            border:none;
            outline:none;
            border-radius:18px;
            background:rgba(255,255,255,0.95);
            font-size:15px;
            transition:0.3s;
        }

        .input-box input:focus{
            box-shadow:0 0 0 4px rgba(56,189,248,0.3);
        }

        .btn{
            width:100%;
            border:none;
            outline:none;
            background:linear-gradient(135deg,#0ea5e9,#06b6d4);
            color:white;
            padding:15px;
            border-radius:18px;
            font-size:16px;
            font-weight:600;
            cursor:pointer;
            transition:0.3s;
        }

        .btn:hover{
            transform:translateY(-2px);
            box-shadow:0 10px 25px rgba(14,165,233,0.45);
        }

        .error{
            margin-top:20px;
            background:#fee2e2;
            color:#b91c1c;
            padding:14px;
            border-radius:14px;
            font-size:14px;
            text-align:center;
        }

        .back{
            margin-top:28px;
            text-align:center;
        }

        .back a{
            color:#dbeafe;
            text-decoration:none;
            font-size:14px;
            transition:0.3s;
        }

        .back a:hover{
            color:white;
        }

        .password-match{
            font-size:13px;
            margin-top:-10px;
            margin-bottom:15px;
            color:#fca5a5;
        }

        @media(max-width:500px){

            .container{
                padding:35px 25px;
            }

            h1{
                font-size:28px;
            }

        }

    </style>

</head>
<body>

<div class="container">

    <div class="logo">
        <i class="fas fa-lock"></i>
    </div>

    <h1>Reset Password</h1>

    <div class="subtitle">
        Enter OTP and create your new password
    </div>

    <form method="POST" id="resetForm">

        <!-- OTP -->

        <div class="input-box">

            <i class="fas fa-key"></i>

            <input type="text"
                   name="otp"
                   id="otp"
                   placeholder="Enter 6-digit OTP"
                   maxlength="6"
                   required>

        </div>

        <!-- NEW PASSWORD -->

        <div class="input-box">

            <i class="fas fa-lock"></i>

            <input type="password"
                   name="new_password"
                   id="newPassword"
                   placeholder="New Password"
                   required>

        </div>

        <!-- CONFIRM PASSWORD -->

        <div class="input-box">

            <i class="fas fa-check-circle"></i>

            <input type="password"
                   name="confirm_password"
                   id="confirmPassword"
                   placeholder="Confirm Password"
                   required>

        </div>

        <div class="password-match" id="passwordError"></div>

        <button type="submit" class="btn" id="resetBtn">

            <i class="fas fa-rotate-right"></i>
            Reset Password

        </button>

    </form>

    {% if error %}
    <div class="error">

        <i class="fas fa-circle-exclamation"></i>
        {{ error }}

    </div>
    {% endif %}

    <div class="back">

        <a href="/login">

            <i class="fas fa-arrow-left"></i>
            Back to Login

        </a>

    </div>

</div>

<script>

const form = document.getElementById('resetForm');

const newPassword =
document.getElementById('newPassword');

const confirmPassword =
document.getElementById('confirmPassword');

const passwordError =
document.getElementById('passwordError');

const otpInput =
document.getElementById('otp');

otpInput.addEventListener('input', function(){

    this.value =
    this.value.replace(/[^0-9]/g,'').slice(0,6);

});

confirmPassword.addEventListener('input', function(){

    if(newPassword.value !== confirmPassword.value){

        passwordError.innerHTML =
        'Passwords do not match';

    }
    else{

        passwordError.innerHTML = '';

    }

});

form.addEventListener('submit', function(e){

    if(newPassword.value !== confirmPassword.value){

        e.preventDefault();

        passwordError.innerHTML =
        'Passwords do not match';

        return;

    }

    if(newPassword.value.length < 6){

        e.preventDefault();

        passwordError.innerHTML =
        'Password must be at least 6 characters';

        return;

    }

    const btn =
    document.getElementById('resetBtn');

    btn.innerHTML =
    '<i class="fas fa-spinner fa-spin"></i> Resetting...';

    btn.disabled = true;

});

</script>

</body>
</html>
